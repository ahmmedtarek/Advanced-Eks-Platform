<!doctype html>
<html>
<head><meta charset="utf-8"><title>myapp</title></head>
<body>
  <h1>Items</h1>
  <form id="f"><input id="name" placeholder="item name" required><button>Add</button></form>
  <ul id="list"></ul>
  <script>
    async function load() {
      const items = await (await fetch('/api/items')).json();
      list.innerHTML = items.map(i => `<li>${i.name}</li>`).join('');
    }
    f.onsubmit = async e => {
      e.preventDefault();
      await fetch('/api/items', {method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({name: name.value})});
      name.value = ''; load();
    };
    load();
  </script>
</body>
</html>
